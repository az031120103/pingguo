<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171717">
  <meta name="description" content="欢迎通过以下方式联系 Pingguo.cn，交流相关事宜。">
  <title>Pingguo.cn — 联系我们</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f6f4;
      --ink: #171717;
      --muted: #696969;
      --accent: #c5222a;
      --line: rgba(23, 23, 23, .16);
      --serif: "Heiti SC", "Lucida Grande", "Hiragino Sans GB", "Hiragino Sans GB W3", verdana, sans-serif;
      --sans: "Heiti SC", "Lucida Grande", "Hiragino Sans GB", "Hiragino Sans GB W3", verdana, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100svh;
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font: 15px/1.7 var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    .page {
      position: relative;
      display: flex;
      min-height: 100svh;
      flex-direction: column;
      overflow: hidden;
      padding: 30px clamp(22px, 6vw, 88px) 24px;
    }
    .topbar, .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand {
      font: 600 19px/1 var(--serif);
      letter-spacing: -.04em;
    }
    .top-note, .footer { color: var(--muted); font-size: 11px; letter-spacing: .12em; }
    main {
      position: relative;
      display: grid;
      width: min(100%, 1080px);
      flex: 1;
      grid-template-columns: minmax(0, 1.3fr) minmax(265px, .7fr);
      align-items: center;
      gap: clamp(42px, 10vw, 150px);
      margin: 0 auto;
      padding: 72px 0 82px;
    }
    .hero { position: relative; z-index: 1; }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 25px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    .eyebrow::before { width: 30px; height: 1px; background: currentColor; content: ""; }
    h1 {
      max-width: 700px;
      margin: 0;
      font: 400 clamp(52px, 8.8vw, 112px)/.98 var(--serif);
      letter-spacing: -.065em;
    }
      h1 span { display: block; color: var(--accent); }
    .intro { max-width: 420px; margin: 29px 0 0; color: #626960; font-size: 15px; line-height: 1.9; }
    .contact {
      position: relative;
      z-index: 1;
      border-top: 1px solid var(--line);
      padding-top: 23px;
    }
    .contact-label { margin: 0 0 20px; color: var(--muted); font-size: 11px; letter-spacing: .18em; }
    .contact-row {
      display: flex;
      min-height: 53px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--line);
    }
    .contact-kind { color: var(--muted); font-size: 13px; }
    .contact-value { color: var(--ink); font-size: 14px; font-weight: 500; text-decoration: none; }
    a.contact-value:hover { color: var(--accent); }
    .contact-action {
      border: 0;
      padding: 8px 0 8px 10px;
      color: var(--accent);
      background: transparent;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    .contact-action:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    .poem {
      position: absolute;
      right: -40px;
      bottom: 8%;
      color: rgba(197, 34, 42, .055);
      font: 400 clamp(150px, 25vw, 340px)/.9 var(--serif);
      letter-spacing: -.12em;
      user-select: none;
      pointer-events: none;
    }
    .footer { border-top: 1px solid var(--line); padding-top: 16px; font-size: 10px; letter-spacing: .1em; }
    @media (max-width: 680px) {
      .page { padding: 24px 24px 20px; }
      .top-note { font-size: 9px; letter-spacing: .08em; }
      main { grid-template-columns: 1fr; gap: 48px; align-content: center; padding: 70px 0 60px; }
      .eyebrow { margin-bottom: 20px; }
      h1 { font-size: clamp(58px, 15vw, 88px); }
      .intro { margin-top: 22px; font-size: 14px; }
      .contact { max-width: 420px; }
      .poem { right: -25px; bottom: 14%; font-size: 210px; }
      .footer { font-size: 9px; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .hero, .contact { animation: arrive .7s ease-out both; }
      .contact { animation-delay: .12s; }
      @keyframes arrive { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    }
  </style>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand">pingguo.cn</div>
      <div class="top-note">欢迎交流 · 期待合作</div>
    </header>
    <main>
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">联系 · CONTACT</p>
        <h1 id="page-title">欢迎联系，<span>共话可能。</span></h1>
        <p class="intro">关于 Pingguo.cn 的相关事宜，欢迎通过以下方式与我们联系。<br>期待坦诚、友好的交流。</p>
      </section>
      <section class="contact" aria-labelledby="contact-title">
        <h2 id="contact-title" class="contact-label">联系方式 · GET IN TOUCH</h2>
        <div class="contact-row">
          <span class="contact-kind">微信</span>
          <span class="contact-value">152 7122 6579</span>
          <button class="contact-action" type="button" data-copy="152 7122 6579" aria-label="复制微信号">复制</button>
        </div>
        <div class="contact-row">
          <span class="contact-kind">邮箱</span>
          <a class="contact-value" href="mailto:5987027@qq.com">5987027@qq.com</a>
          <a class="contact-action" href="mailto:5987027@qq.com">发邮件</a>
        </div>
        <div class="contact-row">
          <span class="contact-kind">QQ</span>
          <span class="contact-value">5987027</span>
          <button class="contact-action" type="button" data-copy="5987027" aria-label="复制 QQ 号">复制</button>
        </div>
      </section>
      <div class="poem" aria-hidden="true">苹</div>
    </main>
    <footer class="footer">
      <span>© Pingguo.cn</span>
      <span>GOOD TO HEAR FROM YOU</span>
    </footer>
  </div>
  <script>
    document.querySelectorAll("[data-copy]").forEach((button) => {
      button.addEventListener("click", async () => {
        const original = button.textContent;
        try {
          await navigator.clipboard.writeText(button.dataset.copy);
          button.textContent = "已复制";
        } catch {
          button.textContent = button.dataset.copy;
        }
        window.setTimeout(() => { button.textContent = original; }, 1600);
      });
    });
  </script>
</body>
</html>
