<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="format-detection" content="telephone=no">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="网站寻求合作或整体转让，如有意向欢迎与我们联系洽谈。">
  <title>pingguo.cn</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      min-height: 100%;
      font: 16px/1.5 "Heiti SC", "Lucida Grande", "Hiragino Sans GB", "Hiragino Sans GB W3", verdana;
      color: #333;
      background: #f9f9f9;
      overflow-x: hidden;
    }
    p { min-height: 24px; }
    em { font-style: normal; color: #f30; }
    .grid { position: relative; min-height: 100vh; padding-bottom: 56px; }
    .main { width: 300px; max-width: calc(100% - 40px); margin: 0 auto 50px; padding-top: 90px; }
    .juzi { font-size: 12px; margin-bottom: 15px; font-style: italic; }
    .label { display: inline-block; width: 48px; text-align: right; }
    .contact-row {
      min-height: 44px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .contact-action {
      min-height: 36px;
      border: 1px solid rgba(255, 51, 0, .24);
      border-radius: 4px;
      padding: 6px 10px;
      color: #d32f16;
      background: #fff7f4;
      font: inherit;
      font-size: 12px;
      line-height: 1.2;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
    }
    .contact-action:hover, .contact-action:focus-visible { border-color: #f30; background: #fff0eb; }
    .contact-action:focus-visible, a:focus-visible { outline: 2px solid #f30; outline-offset: 2px; }
    .email-link { color: #d32f16; font-weight: 600; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    .email-link:hover { color: #a21c0b; }
    .email-row { flex-wrap: wrap; }
    .email-hint { color: #777; font-size: 12px; text-decoration: none; }
    .foot {
      position: absolute;
      bottom: 20px;
      left: 50%;
      width: 300px;
      max-width: calc(100% - 40px);
      transform: translateX(-50%);
      text-align: center;
      color: #777;
      font-size: 12px;
    }
    @media (max-width: 480px) {
      .main { padding-top: 60px; }
      .contact-row { flex-wrap: wrap; }
    }
  </style>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div class="grid">
    <main class="main">
      <div class="juzi" aria-label="南海百咏抄·咏苹果">
        <p>“</p>
        <p>　虞翻宅里起秋风，</p>
        <p>　翠叶玲珑剪未工。</p>
        <p>　错认如花枝上艳，</p>
        <p>　不知荚子缀猩红。</p>
        <p>　　　----《南海百咏抄》</p>
        <p>　　　　　　　　　　　　”</p>
      </div>
      <section class="coming-soon" aria-label="网站信息与联系方式">
        <p>网站寻求合作或整体转让</p>
        <p>如有意向欢迎与我们联系洽谈。</p>
        <p></p>
        <div class="contact-row">
          <span class="label">微信：</span><em>152 7122 6579</em>
          <button class="contact-action" type="button" data-copy="152 7122 6579" aria-label="复制微信号">复制微信号</button>
        </div>
        <div class="contact-row email-row">
          <span class="label">邮箱：</span>
          <a class="email-link" href="mailto:5987027@qq.com" aria-label="发送邮件至 5987027@qq.com">5987027@qq.com</a>
          <a class="contact-action" href="mailto:5987027@qq.com">发送邮件 ↗</a>
        </div>
        <div class="contact-row">
          <span class="label">QQ：</span><em>5987027</em>
          <button class="contact-action" type="button" data-copy="5987027" aria-label="复制 QQ 号">复制 QQ 号</button>
        </div>
      </section>
    </main>
    <footer class="foot">© Pingguo.cn Domain Name</footer>
  </div>
  <script>
    document.querySelectorAll("[data-copy]").forEach((button) => {
      button.addEventListener("click", async () => {
        const original = button.textContent;
        try {
          await navigator.clipboard.writeText(button.dataset.copy);
          button.textContent = "已复制";
        } catch {
          button.textContent = "请手动复制";
        }
        window.setTimeout(() => { button.textContent = original; }, 1600);
      });
    });
  </script>
</body>
</html>
